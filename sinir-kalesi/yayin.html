<!-- claude.ai artifact yayın sayfası: index.html gövdesiyle aynı (iskeleti yayın servisi ekler). -->
<title>Don't Mess with the Necromancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Creepster&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* Tek görünümlü oyun ekranı: koyu çerçeve içinde tam ekran tuval. */
  :root { --frame: #1d1a14; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--frame); overflow: hidden; }
  body { touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
</style>
<canvas id="game" aria-label="Sınır Kalesi oyun alanı"></canvas>
<script>
  // Sürüm damgası: her yayında artırılır; tarayıcı eski önbellek kopyasını kullanmaz (js ve görseller).
  window.SURUM = '210';
  for (const f of ['js/data.js', 'js/game.js']) document.write('<script src="' + f + '?v=' + window.SURUM + '"><\/script>');
</script>
