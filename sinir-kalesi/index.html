<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lord of Graves: Tower Defense</title>
<link href="fonts/fonts.css" rel="stylesheet"><!-- gömülü yazı tipleri: Rubik, Russo One, Metal Mania (internet gerekmez) -->
<style>
  /* Tek görünümlü oyun ekranı: koyu çerçeve içinde tam ekran tuval. */
  :root { --frame: #06030a; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--frame); overflow: hidden; }
  body { touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sınır Kalesi oyun alanı"></canvas>
<script>
  // Sürüm damgası: her yayında artırılır; tarayıcı eski önbellek kopyasını kullanmaz (js ve görseller).
  window.SURUM = '895';
  // dil: kayıtlı seçim (yoksa Türkçe); tr/en dışındakiler için çeviri sözlüğü dil.js'ten önce yüklenir
  window.__dilYukle = (function () {
    var l = null; try { l = localStorage.getItem('sinirKalesi.lang'); } catch (e) {}
    // varsayılan dil Türkçe (Caner, 10 Eki): cihaz diline bakılmaz; başka dil ayarlardan seçilir
    return ['es', 'de', 'fr', 'ru', 'zh'].indexOf(l) >= 0 ? ['js/dil/diller.js'] : []; // 18 Eki: beş dil tek dosyada
  })();
  for (const f of window.__dilYukle.concat(['js/dil.js', 'js/vendor/GameAnalytics.min.js', 'js/ga_anahtar.js', 'js/data.js', 'js/game.js'])) document.write('<script src="' + f + '?v=' + window.SURUM + '"><\/script>');
</script>

</body></html>
